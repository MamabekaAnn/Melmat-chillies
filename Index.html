     <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melmat Chillies</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: #fff;
}

/* NAVBAR */
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    background: white;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    color: #c40000;
    font-weight: 700;
    font-size: 20px;
}

/* MENU */
.nav-links {
    display: flex;
    gap: 20px;
}

.nav-links a {
    text-decoration: none;
    color: #333;
}

/* HAMBURGER */
.menu-toggle {
    display: none;
    font-size: 26px;
    cursor: pointer;
}

/* HERO */
.hero {
    padding: 80px 20px;
    text-align: center;
    background: linear-gradient(to bottom, #0b6623, #ffffff);
    color: white;
}

.hero h1 {
    font-size: 35px;
}

.hero span {
    color: #ff2e2e;
}

.hero p {
    margin: 20px 0;
}

.btn {
    background: #c40000;
    color: white;
    padding: 12px 25px;
    text-decoration: none;
    border-radius: 30px;
    display: inline-block;
}

/* PRODUCTS */
.products {
    padding: 50px 20px;
    text-align: center;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
}

.product {
    border: 1px solid #eee;
    padding: 20px;
    border-radius: 10px;
}

/* FOOTER */
footer {
    background: #0b6623;
    color: white;
    text-align: center;
    padding: 20px;
}

/* MOBILE */
@media(max-width:768px) {

    .nav-links {
        position: absolute;
        top: 70px;
        right: 0;
        background: white;
        flex-direction: column;
        width: 200px;
        display: none;
        padding: 20px;
    }

    .nav-links.active {
        display: flex;
    }

    .menu-toggle {
        display: block;
    }
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
    <div class="logo">🌶️ Melmat</div>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <div class="nav-links" id="navLinks">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Contact</a>
    </div>
</nav>

<!-- HERO -->
<section class="hero">
    <h1>Pure Flavours. <span>Trusted Quality.</span></h1>
    <p>Home made chillies crafted with passion 🌶️</p>

    <a href="https://wa.me/27679435186" class="btn">
        Order Now on WhatsApp
    </a>
</section>

<!-- PRODUCTS -->
<section class="products">
    <h2>Our Products</h2>

    <div class="product-grid">
        <div class="product">
            <h3>Fresh Chillies</h3>
            <p>Natural and farm-grown.</p>
        </div>

        <div class="product">
            <h3>Dried Chillies</h3>
            <p>Strong, rich flavour.</p>
        </div>
    </div>
</section>

<!-- FOOTER -->
<footer>
    <p>📞 067 943 5186</p>
    <p>© Melmat Chillies</p>
</footer>

<script>
function toggleMenu() {
    document.getElementById("navLinks").classList.toggle("active");
}
</script>

</body>
</html>
